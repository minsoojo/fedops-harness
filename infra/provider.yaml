id: fedops-openrouter
display_name: FedOps Claude via OpenRouter
description: Claude Code inference for the FedOps sandbox
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenRouter key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/claude]
